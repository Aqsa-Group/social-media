<!DOCTYPE html>
<html>
<head>
    <title>Settings</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f0f2f5; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .card { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .nav { display: flex; gap: 15px; margin: 15px 0; flex-wrap: wrap; }
        .nav a { text-decoration: none; color: #667eea; font-weight: bold; padding: 8px 16px; border-radius: 5px; }
        .nav a:hover, .nav a.active { background: #667eea; color: white; }
        .info { padding: 10px; background: #f8f9fa; border-radius: 5px; margin: 5px 0; }
        .badge { display: inline-block; padding: 5px 15px; border-radius: 20px; font-size: 14px; }
        .badge-success { background: #d4edda; color: #155724; }
        h1, h2 { color: #1a1a2e; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>⚙️ Settings</h1>
            <div class="nav">
                <a href="/">📊 Dashboard</a>
                <a href="/prompts">📝 Prompts</a>
                <a href="/upload">📸 Upload</a>
                <a href="/analytics">📈 Analytics</a>
                <a href="/settings" class="active">⚙️ Settings</a>
            </div>
        </div>
        
        <div class="card">
            <h2>System Status</h2>
            <div class="info">
                <strong>Status:</strong> <span class="badge badge-success">✅ Online</span>
            </div>
            <div class="info">
                <strong>Version:</strong> 2.0
            </div>
            <div class="info">
                <strong>Platform:</strong> Social Media Automation
            </div>
        </div>
        
        <div class="card">
            <h2>Directories</h2>
            <div class="info"><strong>Uploads:</strong> images/uploads/</div>
            <div class="info"><strong>AI Generated:</strong> images/ai_generated/</div>
            <div class="info"><strong>Posted:</strong> images/posted/</div>
            <div class="info"><strong>Data:</strong> data/</div>
            <div class="info"><strong>Logs:</strong> logs/</div>
            <div class="info"><strong>Prompts:</strong> prompts/</div>
        </div>
    </div>
</body>
</html>
