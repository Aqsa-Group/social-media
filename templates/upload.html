<!DOCTYPE html>
<html>
<head>
    <title>Upload Images</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f0f2f5; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .card { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .nav { display: flex; gap: 15px; margin: 15px 0; flex-wrap: wrap; }
        .nav a { text-decoration: none; color: #667eea; font-weight: bold; padding: 8px 16px; border-radius: 5px; }
        .nav a:hover, .nav a.active { background: #667eea; color: white; }
        input[type="file"] { padding: 10px; border: 1px solid #ddd; border-radius: 5px; width: 100%; }
        .btn { background: #667eea; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
        .btn:hover { background: #5a67d8; }
        .status { padding: 10px; margin-top: 10px; border-radius: 5px; display: none; }
        .success { background: #d4edda; color: #155724; display: block; }
        .error { background: #f8d7da; color: #721c24; display: block; }
        h1, h2 { color: #1a1a2e; }
        .upload-area { border: 2px dashed #ddd; padding: 40px; text-align: center; border-radius: 10px; cursor: pointer; transition: all 0.3s; }
        .upload-area:hover { border-color: #667eea; background: #f8f9fa; }
        .form-group { display: flex; gap: 15px; flex-wrap: wrap; align-items: center; }
        .form-group input { flex: 1; min-width: 200px; }
        .info { color: #666; font-size: 14px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>📸 Upload Images</h1>
            <div class="nav">
                <a href="/">📊 Dashboard</a>
                <a href="/prompts">📝 Prompts</a>
                <a href="/upload" class="active">📸 Upload</a>
                <a href="/analytics">📈 Analytics</a>
                <a href="/settings">⚙️ Settings</a>
            </div>
        </div>
        
        <div class="card">
            <h2>Upload Image</h2>
            <p class="info">Upload images to post on your social media. Images will be posted in order.</p>
            <div class="upload-area" id="dropZone">
                <p>📤 Drag & drop images here or click to browse</p>
                <p style="color:#999;font-size:14px;">Supported: JPG, PNG, GIF, WebP</p>
            </div>
            <form id="uploadForm" enctype="multipart/form-data" style="margin-top:15px;">
                <div class="form-group">
                    <input type="file" id="imageInput" name="image" accept="image/*" required>
                    <button type="submit" class="btn">📤 Upload</button>
                </div>
            </form>
            <div id="message" class="status"></div>
        </div>
    </div>
    
    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('imageInput');
        
        dropZone.addEventListener('click', () => fileInput.click());
        
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#667eea';
            dropZone.style.background = '#f0f4ff';
        });
        
        dropZone.addEventListener('dragleave', () => {
            dropZone.style.borderColor = '#ddd';
            dropZone.style.background = 'transparent';
        });
        
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#ddd';
            dropZone.style.background = 'transparent';
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                fileInput.files = files;
                document.getElementById('uploadForm').dispatchEvent(new Event('submit'));
            }
        });
        
        document.getElementById('uploadForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData();
            const file = document.getElementById('imageInput').files[0];
            if (!file) {
                alert('Please select an image first!');
                return;
            }
            
            const msg = document.getElementById('message');
            msg.className = 'status';
            msg.textContent = '⏳ Uploading...';
            msg.style.display = 'block';
            
            formData.append('image', file);
            
            fetch('/api/upload', {method: 'POST', body: formData})
            .then(r => r.json())
            .then(data => {
                msg.className = 'status ' + (data.success ? 'success' : 'error');
                msg.textContent = data.message || (data.success ? '✅ Uploaded successfully!' : '❌ Upload failed!');
                if (data.success) {
                    document.getElementById('imageInput').value = '';
                    setTimeout(() => location.reload(), 1500);
                }
            })
            .catch(err => {
                msg.className = 'status error';
                msg.textContent = '❌ Error: ' + err.message;
            });
        });
    </script>
</body>
</html>
