<!DOCTYPE html>
<html>
<head>
    <title>Manage Prompts</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f0f2f5; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .card { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .nav { display: flex; gap: 15px; margin: 15px 0; flex-wrap: wrap; }
        .nav a { text-decoration: none; color: #667eea; font-weight: bold; padding: 8px 16px; border-radius: 5px; }
        .nav a:hover, .nav a.active { background: #667eea; color: white; }
        input, select { padding: 10px; border: 1px solid #ddd; border-radius: 5px; margin: 5px; }
        .btn { background: #667eea; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
        .btn:hover { background: #5a67d8; }
        .prompt-item { padding: 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .delete-btn { background: #fc8181; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
        .delete-btn:hover { background: #f56565; }
        .category-tag { background: #667eea; color: white; padding: 2px 10px; border-radius: 12px; font-size: 12px; }
        .status { padding: 10px; margin-top: 10px; border-radius: 5px; display: none; }
        .success { background: #d4edda; color: #155724; display: block; }
        .error { background: #f8d7da; color: #721c24; display: block; }
        h1, h2 { color: #1a1a2e; }
        .empty { color: #999; text-align: center; padding: 20px; }
        .form-group { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .form-group input { flex: 1; min-width: 200px; }
        .form-group select { min-width: 120px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>📝 Manage Prompts</h1>
            <div class="nav">
                <a href="/">📊 Dashboard</a>
                <a href="/prompts" class="active">📝 Prompts</a>
                <a href="/upload">📸 Upload</a>
                <a href="/analytics">📈 Analytics</a>
                <a href="/settings">⚙️ Settings</a>
            </div>
        </div>
        
        <div class="card">
            <h2>Add New Prompt</h2>
            <form id="promptForm" class="form-group">
                <select id="categorySelect">
                    {% for cat in categories %}
                    <option value="{{ cat }}">{{ cat|capitalize }}</option>
                    {% endfor %}
                </select>
                <input type="text" id="promptInput" placeholder="Enter prompt description..." required>
                <button type="submit" class="btn">➕ Add Prompt</button>
            </form>
            <div id="message" class="status"></div>
        </div>
        
        <div class="card">
            <h2>📋 Prompts List ({{ prompts|length }})</h2>
            {% if prompts %}
                {% for prompt in prompts %}
                <div class="prompt-item">
                    <span class="category-tag">{{ prompt.category }}</span>
                    <span style="flex:1;">{{ prompt.text }}</span>
                    <button onclick="deletePrompt({{ loop.index0 }})" class="delete-btn">🗑️</button>
                </div>
                {% endfor %}
            {% else %}
                <div class="empty">No prompts yet. Add some prompts above!</div>
            {% endif %}
        </div>
    </div>
    
    <script>
        document.getElementById('promptForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const category = document.getElementById('categorySelect').value;
            const prompt = document.getElementById('promptInput').value.trim();
            if (!prompt) return;
            
            const msg = document.getElementById('message');
            msg.className = 'status';
            
            fetch('/api/prompts', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({category: category, prompt: prompt})
            })
            .then(r => r.json())
            .then(data => {
                msg.className = 'status ' + (data.success ? 'success' : 'error');
                msg.textContent = data.message || (data.success ? '✅ Added!' : '❌ Failed!');
                if (data.success) {
                    document.getElementById('promptInput').value = '';
                    setTimeout(() => location.reload(), 1000);
                }
            })
            .catch(err => {
                msg.className = 'status error';
                msg.textContent = '❌ Error: ' + err.message;
            });
        });
        
        function deletePrompt(index) {
            if (confirm('Delete this prompt?')) {
                fetch('/api/prompts/' + index, {method: 'DELETE'})
                .then(r => r.json())
                .then(data => {
                    if (data.success) location.reload();
                })
                .catch(err => alert('Error: ' + err.message));
            }
        }
    </script>
</body>
</html>
